<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITANZ Dashboard</title>

    <style>
        :root {
            --bg: #f3f2f1;
            --card-bg: #ffffff;
            --primary: #0078d4;
            --text: #323130;
            --muted: #605e5c;
            --border: #edebe9;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .nav {
            font-size: 14px;
            color: var(--muted);
        }

        /* MAIN CONTENT */
        .container {
            flex: 1;
            padding: 0px;
            display: flex;
            flex-direction: column;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .card-header {
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .card-body {
            flex: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .container {
                padding: 0px;
            }
        }
    </style>
</head>

<body>


    <!-- CONTENT -->
    <main class="container">
        <div class="card">
            <div class="card-body">
                <iframe src="https://mitanz.com/?page_id=448"
                        title="MITANZ Portal"
                        loading="lazy">
                </iframe>
            </div>
        </div>
    </main>

</body>
</html>
